name: Silent Blue

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Scan
        shell: bash
        run: python -m silentblue scan --repo . --manifest-dir "${{ runner.temp }}/silentblue"
